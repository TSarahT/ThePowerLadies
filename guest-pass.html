<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guest Pass — Power Ladies</title>

<!-- This is just a branded redirect to the actual Stripe checkout page.
     Keep it out of search results. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">

<!-- Instant redirect to the live Stripe Payment Link -->
<meta http-equiv="refresh" content="0; url=https://buy.stripe.com/bJe8wI2hRdKkdHYahBejK02">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

<style>
  :root{
    --cream:#F3EFE3;
    --card:#FFFFFF;
    --ink:#1A1917;
    --muted:#6B655A;
    --yellow:#EFE95C;
    --yellow-deep:#D9D240;
    --border:#E7E2D4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Instrument Sans',-apple-system,sans-serif;
    padding:56px 20px 80px;
  }
  .wrap{max-width:480px;margin:0 auto;text-align:center;}
  .eyebrow{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:12px;
    font-weight:500;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 18px;
  }
  .eyebrow::before,.eyebrow::after{
    content:"";
    width:28px;height:2px;
    background:var(--yellow-deep);
  }
  .spinner{
    width:44px;height:44px;
    margin:0 auto 24px;
    border-radius:50%;
    border:4px solid var(--border);
    border-top-color:var(--yellow-deep);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  h1{
    font-family:'Archivo Black',sans-serif;
    text-transform:uppercase;
    letter-spacing:-0.02em;
    line-height:1.05;
    font-size:clamp(22px,4vw,30px);
    margin:0 0 14px;
  }
  h1 .italic{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:400;
    text-transform:none;
    letter-spacing:-0.01em;
  }
  .lead{
    color:var(--muted);
    font-size:15px;
    line-height:1.55;
    margin:0 0 32px;
  }
  .btn{
    display:inline-block;
    text-decoration:none;
    font-weight:600;
    font-size:15px;
    padding:16px 28px;
    border-radius:12px;
    background:var(--yellow);
    color:var(--ink);
  }
  .btn:hover{background:var(--yellow-deep);}
  footer{
    margin-top:48px;
    color:var(--muted);
    font-size:13px;
  }
  footer a{color:var(--yellow-deep);}
</style>
</head>
<body>
<div class="wrap">

  <p class="eyebrow">Power Ladies</p>
  <div class="spinner"></div>
  <h1>Taking you to <span class="italic">checkout</span></h1>
  <p class="lead">You're being redirected to our secure Stripe checkout to purchase your $30 Guest Pass. If nothing happens in a few seconds, use the button below.</p>

  <a class="btn" href="https://buy.stripe.com/bJe8wI2hRdKkdHYahBejK02">Continue to checkout</a>

  <footer>
    Questions? Email <a href="mailto:kelly@thepowerladies.com">kelly@thepowerladies.com</a>
  </footer>

</div>
</body>
</html>
